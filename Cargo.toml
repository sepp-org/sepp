[package]
name = "sepp"
version = "0.1.0"
edition = "2024"

[dependencies]
tonic = { version = "0.14", features = ["tls-ring"] }
tonic-health = "0.14"
tonic-prost = "0.14"
tokio = { version = "1", features = ["full"] }
prost = "0.14"
prost-types = "0.14"
uuid = { version = "1.23.2", features = ["v4"] }
fjall = "3"
flume = "0.12"
serde = { version = "1", features = ["derive"] }
figment = { version = "0.10", features = ["toml", "env"] }
arc-swap = "1"
notify = "8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
opentelemetry = { version = "0.32", default-features = false, features = ["trace", "metrics"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace", "metrics", "rt-tokio"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["grpc-tonic", "trace", "metrics"] }
opentelemetry-prometheus = "0.32"
prometheus = "0.14"
tracing-opentelemetry = "0.33"
opentelemetry-semantic-conventions = "0.32"
garde = { version = "0.23.0", features = ["derive"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
axum = "0.8"
# tls-rustls-no-provider + an explicit ring provider below: pulling axum-server's
# default TLS feature would add aws-lc-rs next to tonic's ring and leave rustls
# with no unambiguous process-level provider (runtime panic).
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
# 1.10 is the first release with the PemObject loaders; std enables the
# from_pem_file variants.
rustls-pki-types = { version = "1.14", features = ["std"] }
serde_json = "1"
toml_edit = "0.22"
tokio-stream = { version = "0.1", features = ["sync"] }
rust-embed = "8"
base64 = "0.22"
sha2 = "0.11"


[build-dependencies]
tonic-prost-build = "0.14"
protox = "0.9"

[dev-dependencies]
rcgen = "0.14"

[profile.release]
lto = "fat"
codegen-units = 1
