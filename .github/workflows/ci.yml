name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Cancel superseded runs for the same ref, except on tag pushes — every release
# tag should produce its own image regardless of whether a newer tag arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --all-features

  # The server embeds the committed admin-ui/dist (rust-embed), so every ship
  # channel serves exactly what is in git. Rebuild the UI and fail on drift.
  admin-ui-fresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: admin-ui/package-lock.json
      - run: npm ci
        working-directory: admin-ui
      - run: npm run build
        working-directory: admin-ui
      - name: Fail if committed dist is stale
        # -N stages new files as intent-to-add so freshly hashed assets show in the diff
        run: |
          git add -N admin-ui/dist
          git diff --stat --exit-code -- admin-ui/dist

  audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2.85.8
        with:
          tool: cargo-audit
      - run: cargo audit

  docker-build:
    needs: [fmt, clippy, test, admin-ui-fresh]
    # Build+push only on master pushes and release tags
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      security-events: write
      actions: read
    steps:
      - name: Set platform pair
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - uses: actions/checkout@v7

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}
          provenance: false
          sbom: false
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Smoke test image
        if: matrix.platform == 'linux/amd64'
        run: |
          docker run -d --name smoke ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          for i in $(seq 1 30); do
            if docker logs smoke 2>&1 | grep -q "queue server listening"; then
              docker rm -f smoke
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' smoke)" != "true" ]; then
              echo "::error::container exited during startup"
              docker logs smoke
              docker rm -f smoke
              exit 1
            fi
            sleep 1
          done
          echo "::error::server did not report listening within 30s"
          docker logs smoke
          docker rm -f smoke
          exit 1

      # Run Trivy only on amd64 — both arches share the same code
      - name: Scan image with Trivy
        if: matrix.platform == 'linux/amd64'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload Trivy results to Security tab
        if: matrix.platform == 'linux/amd64'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-merge:
    needs: docker-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=master,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # No bare major tag while pre-1.0: `:0` would silently roll users
            # across breaking 0.x releases.
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}

  cargo-publish-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo publish --dry-run --locked

  cargo-publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [fmt, clippy, test, cargo-publish-dry-run, admin-ui-fresh]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Skip if this version is already on crates.io.
      # If some jobs failed for example and we need to re-tag.
      - run: |
          version=$(cargo pkgid | sed 's/.*[@#]//')
          if curl -fsS -A "sepp-ci (github.com/sepp-org/sepp)" \
              "https://crates.io/api/v1/crates/sepp/$version" >/dev/null 2>&1; then
            echo "sepp $version already on crates.io, skipping publish"
          else
            cargo publish --locked --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
          fi

  release-build:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: docker-merge
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            cc: musl-gcc
          - os: linux
            arch: arm64
            target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            cc: musl-gcc
          - os: macos
            arch: arm64
            target: aarch64-apple-darwin
            runner: macos-latest
          - os: windows
            arch: amd64
            target: x86_64-pc-windows-msvc
            runner: windows-latest
            bin-suffix: .exe
            rustflags: -C target-feature=+crt-static
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Install musl toolchain
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }} --bin sepp
        env:
          CC: ${{ matrix.cc }}
          RUSTFLAGS: ${{ matrix.rustflags }}
      - name: Package binary
        shell: bash
        run: |
          version=${GITHUB_REF#refs/tags/}
          name="sepp-${version}-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.bin-suffix }}"
          cp "target/${{ matrix.target }}/release/sepp${{ matrix.bin-suffix }}" "$name"
          # sha256sum on linux/windows runners, shasum on macos
          if command -v sha256sum >/dev/null; then
            sha256sum "$name" > "$name.sha256"
          else
            shasum -a 256 "$name" > "$name.sha256"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.os }}-${{ matrix.arch }}
          path: sepp-*
          if-no-files-found: error
          retention-days: 1

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          pattern: release-*
          merge-multiple: true
      - name: Combine checksums
        working-directory: release-assets
        run: |
          cat sepp-*.sha256 > SHA256SUMS
          rm sepp-*.sha256
      - name: Generate changelog
        id: changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          # --latest = just this release's commits; --strip header = no preamble
          args: --latest --strip header
      - uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.changelog.outputs.content }}
          files: |
            release-assets/sepp-*-linux-*
            release-assets/sepp-*-macos-*
            release-assets/sepp-*-windows-*
            release-assets/SHA256SUMS
