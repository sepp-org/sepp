version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      opentelemetry:
        patterns:
          - "opentelemetry*"
          - "tracing-opentelemetry"
      tonic:
        patterns:
          - "tonic*"
          - "prost*"
      tracing:
        patterns:
          - "tracing"
          - "tracing-subscriber"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /admin-ui
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # vue-tsc wraps the JS compiler API that TS 7 no longer ships
      - dependency-name: typescript
        versions: [">=7"]
    groups:
      vue:
        patterns:
          - "vue"
          - "vue-*"
          - "@vitejs/plugin-vue"
      codemirror:
        patterns:
          - "@codemirror/*"
          - "@lezer/*"

  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # Next needs the compiler API TS 7 dropped (experimental.useTypeScriptCli to opt in)
      - dependency-name: typescript
        versions: [">=7"]
      # track the Node major in docs.yml
      - dependency-name: "@types/node"
        versions: [">=23"]
    groups:
      fumadocs:
        patterns:
          - "fumadocs-*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
