syntax = "proto3";

package sepp.storage.v1;

import "sepp/v1/queue.proto";

// Internal serialization format for the committer's mutating operations: the
// future replicated-log entry, pinned by a golden test before anything writes
// it to a log. Repo-local: unlike sepp/v1/queue.proto this file is NOT part of
// the published contract on buf.build/sepp-org/sepp-proto and is never exposed
// to clients.
//
// The now_ms fields carry the wall clock every time-dependent apply decision
// reads. The committer stamps them at channel-drain time, one clock read
// shared by every op in a cycle, so replaying an op stream reproduces
// identical timestamps.

// Enqueue-apply limits, resolved from the proposer's config when the op is
// built. Apply reads these instead of node-local config so every store applies
// the op identically.
message JobLimits {
  // Final priority: the request's, or the queue default.
  uint32 priority = 1;

  // Final max attempts: the request's or the queue default, ceiling-clamped.
  uint32 max_attempts = 2;

  int64 dedup_window_ms = 3;

  // Unset = unbounded.
  optional uint64 max_queue_depth = 4;
}

// An EnqueueRequest plus its pre-assigned job ID and resolved limits. IDs are
// generated before an op is built so applying the op is deterministic.
message PreparedJob {
  sepp.v1.EnqueueRequest request = 1;

  string job_id = 2;

  JobLimits limits = 3;
}

message EnqueueOp {
  repeated PreparedJob jobs = 1;
  int64 now_ms = 2;
}

message EnqueueAtomicOp {
  repeated PreparedJob jobs = 1;
  int64 now_ms = 2;
}

message ReserveOp {
  repeated string queues = 1;
  uint64 lease_ms = 2;
  uint64 max_jobs = 3;
  int64 now_ms = 4;
}

message AckOp {
  string job_id = 1;
  uint32 attempt = 2;
}

message NackOp {
  sepp.v1.NackRequest request = 1;
  int64 now_ms = 2;

  // 0 = immediately ready
  uint64 retry_delay_ms = 3;

  // Whether a dead-lettered job is stored in the DLQ or dropped. Resolved from
  // the proposer's retention config.
  bool dead_letter_enabled = 4;
}

message ExtendOp {
  sepp.v1.ExtendRequest request = 1;
  int64 now_ms = 2;

  // Final lease: the request's duration clamped to the queue's max at propose
  // time. The request's own lease_duration is never read at apply.
  uint64 lease_ms = 3;
}

message DrainDeadLettersOp {
  optional string queue = 1;
  uint64 max = 2;
  uint64 scan_cap = 3;
}

message CloseQueueOp {
  string queue = 1;
  int64 now_ms = 2;

  // How long the tombstone outlives this close; the rejection deadline is
  // now_ms + grace_ms.
  int64 grace_ms = 3;
}

message OpenQueueOp {
  string queue = 1;
}

message RequeueDeadLettersOp {
  string queue = 1;
  repeated bytes keys = 2;
  int64 now_ms = 3;
}

// The job state an admin dead-letter operation drains from.
enum JobState {
  JOB_STATE_UNSPECIFIED = 0;
  JOB_STATE_READY = 1;
  JOB_STATE_SCHEDULED = 2;
  JOB_STATE_INFLIGHT = 3;
  JOB_STATE_DEAD_LETTER = 4;
}

message DeadLetterJobsOp {
  string queue = 1;
  JobState state = 2;
  repeated bytes keys = 3;
  optional string reason = 4;
  int64 now_ms = 5;

  // See NackOp.dead_letter_enabled.
  bool dead_letter_enabled = 6;
}

message DeleteDeadLettersOp {
  string queue = 1;
  repeated bytes keys = 2;
}

message PurgeQueueChunkOp {
  string queue = 1;
  uint64 max = 2;
}

message SweepOp {
  int64 now_ms = 1;
  uint64 budget = 2;

  // Dead letters that failed at or before this are deleted. Unset when
  // retention is disabled.
  optional int64 retention_cutoff_ms = 3;

  // See NackOp.dead_letter_enabled.
  bool dead_letter_enabled = 4;
}

message AuditRecord {
  string actor = 1;
  string role = 2;
  string action = 3;

  // Action-specific fields as a JSON object.
  string details_json = 4;
}

message AuditAppendOp {
  AuditRecord record = 1;
  int64 now_ms = 2;
}

// One mutating committer operation. Exactly one field is set.
message Op {
  oneof op {
    EnqueueOp enqueue = 1;
    EnqueueAtomicOp enqueue_atomic = 2;
    ReserveOp reserve = 3;
    AckOp ack = 4;
    NackOp nack = 5;
    ExtendOp extend = 6;
    DrainDeadLettersOp drain_dead_letters = 7;
    CloseQueueOp close_queue = 8;
    OpenQueueOp open_queue = 9;
    RequeueDeadLettersOp requeue_dead_letters = 10;
    DeadLetterJobsOp dead_letter_jobs = 11;
    DeleteDeadLettersOp delete_dead_letters = 12;
    PurgeQueueChunkOp purge_queue_chunk = 13;
    SweepOp sweep = 14;
    AuditAppendOp audit_append = 15;
  }
}
